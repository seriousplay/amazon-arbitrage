repos:
  - repo: https://github.com/pre-commit/mirrors-black
    rev: '24.4.2'
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.5.6'
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --line-length=100, --select=I,F,E,W]
        # Only check staged files, not entire codebase
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.10.0'
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.5.0, sqlalchemy>=2.0.0]
        exclude: ^tests/|^data/|^logs/|^venv/
        config_file: pyproject.toml

  - repo: https://github.com/pytest-dev/pytest
    rev: 'v8.3.2'
    hooks:
      - id: pytest-check
        stages: [manual]
        additional_dependencies: [pytest-asyncio>=0.21.0]
        pass_filenames: []
        always_run: true
