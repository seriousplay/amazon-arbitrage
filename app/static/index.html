<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Amazon Arbitrage Agent</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="dot"></span>
    <h1>Amazon Arbitrage Agent</h1>
    <span class="status-badge ready" id="agentStatus">就绪</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:var(--surface2)" id="loginDot">1688 --</span>
    <button class="btn-ghost" style="font-size:12px;padding:6px 8px" id="btnSchedule" title="定时任务" onclick="ScheduleManager.togglePanel()">⏰</button>
    <button class="btn-ghost" onclick="refreshAll()" style="font-size:11px">刷新</button>
  </div>
</header>

<div class="container">

  <!-- Control bar -->
  <div class="control-bar">
    <div class="control-row">
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div>
          <label style="cursor:pointer;font-size:11px;color:var(--text2)" onclick="CategoryManager.togglePanel()">品类选择 <span id="catCountDisplay" style="color:var(--accent)">--</span> <span style="font-size:9px">▾</span></label>
          <div style="font-size:11px;color:var(--text2);margin-top:2px" id="catChips">加载中...</div>
        </div>
        <div>
          <label>每类商品数</label>
          <input class="num-input" id="scanCount" value="15" type="number" min="5" max="50">
        </div>
      </div>
      <div style="align-self:flex-end;display:flex;gap:6px">
        <button class="btn btn-primary" id="btnDiscover" onclick="runDiscover()">开始挖掘</button>
        <button class="btn" id="btnStop" onclick="cancelScan()" style="background:var(--red);color:#fff;display:none">停止扫描</button>
        <button class="btn" id="btnMatch" onclick="runMatch()" style="background:var(--green);color:#fff;display:none">匹配1688</button>
      </div>
    </div>
    <!-- Category selector panel (collapsible) -->
    <div id="catPanel" style="display:none;margin-top:10px;padding:10px;background:var(--surface2);border-radius:var(--r2);border:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:11px;color:var(--text2)">选择要扫描的品类</span>
        <span style="font-size:11px;cursor:pointer;color:var(--accent)" onclick="CategoryManager.toggleAll(true)">全选</span>
        <span style="font-size:11px;cursor:pointer;color:var(--text2)" onclick="CategoryManager.toggleAll(false)">取消全选</span>
      </div>
      <div id="catCheckboxGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px"></div>
    </div>

    <div id="actionInfo" style="font-size:11px;color:var(--text2);margin-top:6px"></div>
    <div id="scheduleInfo" style="font-size:11px;color:var(--text2);margin-top:6px;display:none"></div>
  </div>

  <!-- Content -->
  <div id="mainContent">
    <div class="empty-state">
      <div class="icon">🕵️</div>
      <h2>准备好挖掘选品机会</h2>
      <p>选择品类后点击「开始挖掘」，多机器人并行扫描 Amazon 热销商品</p>
    </div>
  </div>

</div>

<script defer src="/static/js/app.js"></script>
</body>
</html>
